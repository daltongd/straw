[package]
name = "straw"
version = "0.0.3"
edition = "2021"

[features]
openssl-on-win32 = ["dep:ssh2"]

[dependencies]
clap = { version = "4.5.23", features = ["derive"] }
serde = { version = "1.0.216", features = ["derive"] }
serde_with = "3.11.0"
toml = "0.8.19"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
home = "0.5.9"
git2 = "0.20.0"
auth-git2 = "0.5.5"
whoami = "1.5.2"
mlua = { version = "0.10.2", features = [
    "lua54",
    "vendored",
    "macros",
    "serialize",
] }
lazy-regex = "3.4.1"

[target.'cfg(windows)'.dependencies]
ssh2 = { version = "0.9.4", optional = true, features = ["openssl-on-win32"] }

[target.'cfg(unix)'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
